<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account — Keyflame</title><link rel="icon" type="image/svg+xml" href="keyflame-logo.svg"><link rel="stylesheet" href="theme.css"></head>
<body style="min-height:100vh;font-family:Inter,Arial,sans-serif;background:#090809;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px">
<main style="width:100%;max-width:520px"><section style="padding:42px;border-radius:26px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);text-align:center">
<h1>This page is disabled.</h1><p style="color:#929292;margin:12px 0 26px">Keyflame accounts are managed by the server administrator.</p><a href="login.html" style="display:inline-block;color:#fff;background:linear-gradient(135deg,#ff4fb5,#ff78c7);padding:13px 22px;border-radius:13px;text-decoration:none;font-weight:700">Back to Sign In</a>
</section></main><script>
(function(){
  if(window.__keyflameGithubUI)return;
  window.__keyflameGithubUI=true;
  const path=(location.pathname.split("/").pop()||"index.html").toLowerCase();
  const appPages=["dashboard.html","games.html","bucks.html","history.html","analytics.html","profile.html","settings.html","admin.html"];
  const isApp=appPages.includes(path);
  document.querySelectorAll(".nav-link[href]").forEach(link=>{
    const href=(link.getAttribute("href")||"").split("#")[0].split("/").pop().toLowerCase();
    if(href===path)link.classList.add("active");
  });
  if(isApp && document.querySelector(".main") && !document.querySelector(".kf-header")){
    const header=document.createElement("header");
    header.className="kf-header";
    header.innerHTML='<div class="kf-search-wrap"><span class="kf-search-icon">⌕</span><input class="kf-header-search" id="kfHeaderSearch" aria-label="Search Keyflame" placeholder="Search Keyflame" autocomplete="off"><span class="kf-shortcut">Ctrl K</span></div><div class="kf-header-spacer"></div><button class="kf-command-btn" type="button" id="kfCommandOpen">Command palette</button><button class="kf-collapse-btn" type="button" id="kfCollapse">☰</button>';
    document.body.prepend(header);
  }
  const routes=[["Dashboard","dashboard.html"],["Games","games.html"],["AB Bucks","bucks.html"],["History","history.html"],["Analytics","analytics.html"],["Profile","profile.html"],["Settings","settings.html"],["Admin","admin.html"]];
  function openCommand(initial){
    let modal=document.querySelector(".kf-command");
    if(!modal){
      modal=document.createElement("div");
      modal.className="kf-command";
      modal.innerHTML='<div class="kf-command-box" role="dialog" aria-modal="true" aria-label="Keyflame command palette"><input class="kf-command-input" placeholder="Type a page or action..." aria-label="Command search"><div class="kf-command-list"></div></div>';
      document.body.appendChild(modal);
      const input=modal.querySelector(".kf-command-input");
      input.addEventListener("input",()=>render(input.value));
      modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("open")});
      input.addEventListener("keydown",e=>{if(e.key==="Escape")modal.classList.remove("open");if(e.key==="Enter"){const first=modal.querySelector(".kf-command-item");if(first)location.href=first.getAttribute("href")}});
    }
    const input=modal.querySelector(".kf-command-input");
    input.value=initial||"";
    render(initial||"");
    modal.classList.add("open");
    input.focus();
    function render(q){
      const query=(q||"").trim().toLowerCase();
      const list=routes.filter(r=>r[0].toLowerCase().includes(query));
      modal.querySelector(".kf-command-list").innerHTML=list.map(r=>'<a class="kf-command-item" href="'+r[1]+'"><span>↳</span><span>'+r[0]+'</span><small>'+r[1]+'</small></a>').join("")||'<div style="padding:12px;color:var(--kf-muted)">No matching page.</div>';
    }
  }
  const openBtn=document.getElementById("kfCommandOpen"); if(openBtn)openBtn.addEventListener("click",()=>openCommand(""));
  const headerSearch=document.getElementById("kfHeaderSearch");
  if(headerSearch)headerSearch.addEventListener("keydown",e=>{if(e.key==="Enter")openCommand(headerSearch.value);if(e.key==="Escape")headerSearch.blur()});
  const collapse=document.getElementById("kfCollapse");
  if(collapse){collapse.addEventListener("click",()=>{document.body.classList.toggle("kf-collapsed");sessionStorage.setItem("keyflame_sidebar_collapsed",document.body.classList.contains("kf-collapsed")?"1":"0")});if(sessionStorage.getItem("keyflame_sidebar_collapsed")==="1")document.body.classList.add("kf-collapsed")}
  document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openCommand("")}if(e.key==="/"&&!/input|textarea|select/i.test(document.activeElement.tagName||"")){e.preventDefault();if(headerSearch)headerSearch.focus()}});
  const reveal=document.querySelectorAll(".card,.game-card,.section,.profile-card,.balance-card,.activity,main>section");
  reveal.forEach((el,i)=>{el.classList.add("kf-reveal");el.style.transitionDelay=Math.min(i*25,180)+"ms"});
  if("IntersectionObserver" in window){const io=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("kf-visible");io.unobserve(entry.target)}})},{threshold:.04});reveal.forEach(el=>io.observe(el))}else reveal.forEach(el=>el.classList.add("kf-visible"));
  const style=document.createElement("style");style.textContent=".kf-reveal.kf-visible{opacity:1;transform:none}.card,.game-card,.section,.profile-card,.balance-card{transition:transform .15s ease,border-color .15s ease}.card:hover,.game-card:hover,.profile-card:hover,.balance-card:hover{transform:translateY(-1px)}";document.head.appendChild(style);
})();
</script>
</body>
</html>
