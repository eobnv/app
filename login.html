<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In — Keyflame</title>
    <link rel="icon" type="image/svg+xml" href="keyflame-logo.svg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Inter, Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 82, 183, 0.14), transparent 32%),
                radial-gradient(circle at 85% 80%, rgba(255, 82, 183, 0.10), transparent 32%),
                #090809;
            color: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 28px;
        }

        .logo span {
            color: #ff5bbd;
        }

        .login-card {
            padding: 42px;
            border-radius: 26px;

            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.10);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255,255,255,0.04);
        }

        .heading {
            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 34px;
            letter-spacing: -1px;
            margin-bottom: 9px;
        }

        .heading p {
            color: #929292;
            font-size: 15px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-size: 13px;
            color: #bcbcbc;
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            height: 52px;

            padding: 0 16px;

            border-radius: 13px;
            border: 1px solid rgba(255,255,255,0.10);

            outline: none;

            background: rgba(255,255,255,0.055);
            color: white;

            font-size: 15px;

            transition: 0.2s ease;
        }

        .field input::placeholder {
            color: #666;
        }

        .field input:focus {
            border-color: rgba(255,91,189,0.75);

            box-shadow:
                0 0 0 3px rgba(255,91,189,0.10),
                0 0 25px rgba(255,91,189,0.08);
        }

        .error {
            display: none;

            margin-bottom: 18px;
            padding: 12px 14px;

            border-radius: 11px;

            background: rgba(255, 70, 150, 0.08);
            border: 1px solid rgba(255, 70, 150, 0.18);

            color: #ff86c7;
            font-size: 13px;
        }

        .login-button {
            width: 100%;
            height: 53px;

            border: none;
            border-radius: 13px;

            background: linear-gradient(
                135deg,
                #ff4fb5,
                #ff78c7
            );

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(255, 79, 181, 0.22);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: wait;
            transform: none;
        }

        .back {
            display: block;

            margin-top: 25px;

            text-align: center;

            color: #777;
            text-decoration: none;

            font-size: 13px;

            transition: 0.2s ease;
        }

        .back:hover {
            color: white;
        }

        .security-note {
            text-align: center;
            margin-top: 18px;

            color: #555;
            font-size: 11px;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 30px 24px;
                border-radius: 21px;
            }

            .heading h1 {
                font-size: 29px;
            }

            .logo {
                margin-bottom: 22px;
            }
        }
    </style>
  <link rel="stylesheet" href="theme.css">
</head>

<body>

    <main class="login-container">

        <div class="logo">
            Key<span>flame</span>
        </div>

        <section class="login-card">

            <div class="heading">
                <h1>Welcome back.</h1>
                <p>Sign in to your AB Server.</p>
            </div>

            <form id="loginForm">

                <div class="field">
                    <label for="username">Username</label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="field">
                    <label for="password">Password</label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="error" id="error">
                    Incorrect username or password.
                </div>

                <button
                    class="login-button"
                    id="loginButton"
                    type="submit"
                >
                    Sign In
                </button>

            </form>

            <a class="back" href="index.html">
                ← Back to Keyflame
            </a>

            <div class="security-note">
                Keyflame AB Server
            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        const form = document.getElementById("loginForm");
        const button = document.getElementById("loginButton");
        const error = document.getElementById("error");

        const ACCOUNTS = {
            admin: "admin@keyflame.local",
            kian6203: "kian6203@keyflame.local"
        };

        form.addEventListener("submit", async function(event) {
            event.preventDefault();
            error.style.display = "none";
            button.disabled = true;
            button.textContent = "Signing in...";

            const username = document.getElementById("username").value.trim().toLowerCase();
            const password = document.getElementById("password").value;

            if (!ACCOUNTS[username]) {
                error.textContent = "Incorrect username or password.";
                error.style.display = "block";
                button.disabled = false;
                button.textContent = "Sign In";
                return;
            }

            let { data, error: authError } = await keyflameSupabase.auth.signInWithPassword({
                email: ACCOUNTS[username],
                password
            });

            if (authError && password === "1234") {
                const signUp = await keyflameSupabase.auth.signUp({
                    email: ACCOUNTS[username],
                    password,
                    options: {
                        data: {
                            username,
                            display_name: username === "admin" ? "Admin" : "Kian"
                        }
                    }
                });

                if (!signUp.error) {
                    data = signUp.data;
                    authError = null;
                } else {
                    const retry = await keyflameSupabase.auth.signInWithPassword({
                        email: ACCOUNTS[username],
                        password
                    });
                    data = retry.data;
                    authError = retry.error;
                }
            }

            if (authError || !data?.session) {
                error.textContent = "Incorrect username or password.";
                error.style.display = "block";
                button.disabled = false;
                button.textContent = "Sign In";
                return;
            }

            sessionStorage.setItem("keyflame_user", username);

            const { data: profile } = await keyflameSupabase
                .from("profiles")
                .select("role, username")
                .eq("id", data.user.id)
                .maybeSingle();

            const role = profile?.role || (username === "admin" ? "admin" : "user");
            sessionStorage.setItem("keyflame_role", role);

            window.location.href = role === "admin" ? "admin.html" : "dashboard.html";
        });
    </script>ipt>

</body>
</html>
