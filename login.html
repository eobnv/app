<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Keyflame</title>
<link rel="icon" type="image/svg+xml" href="keyflame-logo.svg">
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Inter,Arial,Helvetica,sans-serif;background:radial-gradient(circle at 15% 20%,rgba(255,82,183,.14),transparent 32%),radial-gradient(circle at 85% 80%,rgba(255,82,183,.10),transparent 32%),#090809;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.login-container{width:100%;max-width:440px}.logo{text-align:center;margin-bottom:28px}.login-card{padding:42px;border-radius:26px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 25px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04)}
.heading{margin-bottom:30px}.heading h1{font-size:34px;letter-spacing:-1px;margin-bottom:9px}.heading p{color:#929292;font-size:15px}.field{margin-bottom:20px}.field label{display:block;font-size:13px;color:#bcbcbc;margin-bottom:8px}.field input{width:100%;height:52px;padding:0 16px;border-radius:13px;border:1px solid rgba(255,255,255,.10);outline:none;background:rgba(255,255,255,.055);color:#fff;font-size:15px}.field input:focus{border-color:rgba(255,91,189,.75);box-shadow:0 0 0 3px rgba(255,91,189,.10)}.field input::placeholder{color:#666}
.error{display:none;margin-bottom:18px;padding:12px 14px;border-radius:11px;background:rgba(255,70,150,.08);border:1px solid rgba(255,70,150,.18);color:#ff86c7;font-size:13px}.login-button{width:100%;height:53px;border:0;border-radius:13px;background:linear-gradient(135deg,#ff4fb5,#ff78c7);color:#fff;font-size:15px;font-weight:700;cursor:pointer}.login-button:disabled{opacity:.65;cursor:wait}.back{display:block;margin-top:25px;text-align:center;color:#777;text-decoration:none;font-size:13px}.back:hover{color:#fff}.security-note{text-align:center;margin-top:18px;color:#555;font-size:11px}
@media(max-width:500px){.login-card{padding:30px 24px;border-radius:21px}.heading h1{font-size:29px}.logo{margin-bottom:22px}}
</style>
</head>
<body>
<main class="login-container">
<div class="logo"><span class="kf-logo-mark">K</span></div>
<section class="login-card">
<div class="heading"><h1>Welcome back.</h1><p>Sign in to your AB Server.</p></div>
<form id="loginForm">
<div class="field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" placeholder="Enter your username" required></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div>
<div class="error" id="error">Incorrect username or password.</div>
<button class="login-button" id="loginButton" type="submit">Sign In</button>
</form>
<a class="back" href="index.html">← Back to Keyflame</a>
<div class="security-note">Keyflame AB Server</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
const form=document.getElementById("loginForm"),button=document.getElementById("loginButton"),error=document.getElementById("error");
form.addEventListener("submit",async e=>{
 e.preventDefault(); error.style.display="none"; button.disabled=true; button.textContent="Signing in...";
 const username=document.getElementById("username").value.trim().toLowerCase(),password=document.getElementById("password").value;
 const email=username+"@keyflame.app";
 const {data,error:authError}=await keyflameSupabase.auth.signInWithPassword({email,password});
 if(authError||!data?.session){error.textContent="Incorrect username or password.";error.style.display="block";button.disabled=false;button.textContent="Sign In";return}
 sessionStorage.setItem("keyflame_user",username);
 const {data:profile}=await keyflameSupabase.from("profiles").select("role,username").eq("id",data.user.id).maybeSingle();
 const role=profile?.role||"user";
 sessionStorage.setItem("keyflame_role",role);
 window.location.href=role==="admin"?"admin.html":"dashboard.html";
});
</script><script>
(function(){
  if(window.__keyflameGithubUI)return;
  window.__keyflameGithubUI=true;
  const path=(location.pathname.split("/").pop()||"index.html").toLowerCase();
  const appPages=["dashboard.html","games.html","bucks.html","history.html","analytics.html","profile.html","settings.html","admin.html"];
  const isApp=appPages.includes(path);
  document.querySelectorAll(".nav-link[href]").forEach(link=>{
    const href=(link.getAttribute("href")||"").split("#")[0].split("/").pop().toLowerCase();
    if(href===path)link.classList.add("active");
  });
  if(isApp && document.querySelector(".main") && !document.querySelector(".kf-header")){
    const header=document.createElement("header");
    header.className="kf-header";
    header.innerHTML='<div class="kf-search-wrap"><span class="kf-search-icon">⌕</span><input class="kf-header-search" id="kfHeaderSearch" aria-label="Search Keyflame" placeholder="Search Keyflame" autocomplete="off"><span class="kf-shortcut">Ctrl K</span></div><div class="kf-header-spacer"></div><button class="kf-command-btn" type="button" id="kfCommandOpen">Command palette</button><button class="kf-collapse-btn" type="button" id="kfCollapse">☰</button>';
    document.body.prepend(header);
  }
  const routes=[["Dashboard","dashboard.html"],["Games","games.html"],["AB Bucks","bucks.html"],["History","history.html"],["Analytics","analytics.html"],["Profile","profile.html"],["Settings","settings.html"],["Admin","admin.html"]];
  function openCommand(initial){
    let modal=document.querySelector(".kf-command");
    if(!modal){
      modal=document.createElement("div");
      modal.className="kf-command";
      modal.innerHTML='<div class="kf-command-box" role="dialog" aria-modal="true" aria-label="Keyflame command palette"><input class="kf-command-input" placeholder="Type a page or action..." aria-label="Command search"><div class="kf-command-list"></div></div>';
      document.body.appendChild(modal);
      const input=modal.querySelector(".kf-command-input");
      input.addEventListener("input",()=>render(input.value));
      modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("open")});
      input.addEventListener("keydown",e=>{if(e.key==="Escape")modal.classList.remove("open");if(e.key==="Enter"){const first=modal.querySelector(".kf-command-item");if(first)location.href=first.getAttribute("href")}});
    }
    const input=modal.querySelector(".kf-command-input");
    input.value=initial||"";
    render(initial||"");
    modal.classList.add("open");
    input.focus();
    function render(q){
      const query=(q||"").trim().toLowerCase();
      const list=routes.filter(r=>r[0].toLowerCase().includes(query));
      modal.querySelector(".kf-command-list").innerHTML=list.map(r=>'<a class="kf-command-item" href="'+r[1]+'"><span>↳</span><span>'+r[0]+'</span><small>'+r[1]+'</small></a>').join("")||'<div style="padding:12px;color:var(--kf-muted)">No matching page.</div>';
    }
  }
  const openBtn=document.getElementById("kfCommandOpen"); if(openBtn)openBtn.addEventListener("click",()=>openCommand(""));
  const headerSearch=document.getElementById("kfHeaderSearch");
  if(headerSearch)headerSearch.addEventListener("keydown",e=>{if(e.key==="Enter")openCommand(headerSearch.value);if(e.key==="Escape")headerSearch.blur()});
  const collapse=document.getElementById("kfCollapse");
  if(collapse){collapse.addEventListener("click",()=>{document.body.classList.toggle("kf-collapsed");sessionStorage.setItem("keyflame_sidebar_collapsed",document.body.classList.contains("kf-collapsed")?"1":"0")});if(sessionStorage.getItem("keyflame_sidebar_collapsed")==="1")document.body.classList.add("kf-collapsed")}
  document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openCommand("")}if(e.key==="/"&&!/input|textarea|select/i.test(document.activeElement.tagName||"")){e.preventDefault();if(headerSearch)headerSearch.focus()}});
  const reveal=document.querySelectorAll(".card,.game-card,.section,.profile-card,.balance-card,.activity,main>section");
  reveal.forEach((el,i)=>{el.classList.add("kf-reveal");el.style.transitionDelay=Math.min(i*25,180)+"ms"});
  if("IntersectionObserver" in window){const io=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("kf-visible");io.unobserve(entry.target)}})},{threshold:.04});reveal.forEach(el=>io.observe(el))}else reveal.forEach(el=>el.classList.add("kf-visible"));
  const style=document.createElement("style");style.textContent=".kf-reveal.kf-visible{opacity:1;transform:none}.card,.game-card,.section,.profile-card,.balance-card{transition:transform .15s ease,border-color .15s ease}.card:hover,.game-card:hover,.profile-card:hover,.balance-card:hover{transform:translateY(-1px)}";document.head.appendChild(style);
})();
</script>
</body>
</html>
