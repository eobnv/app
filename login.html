```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Keyflame</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090809;
      color: white;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      background: #151315;
      border: 1px solid #302a30;
      border-radius: 18px;
      box-shadow: 0 25px 80px rgba(0,0,0,.4);
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 35px;
    }

    .logo span {
      color: #f05aa9;
    }

    .eyebrow {
      color: #f05aa9;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .description {
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border-radius: 9px;
      border: 1px solid #393339;
      background: #0d0c0d;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #f05aa9;
    }

    button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 9px;
      background: #f05aa9;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ff70b7;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #777;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: white;
    }

    #message {
      text-align: center;
      color: #f05aa9;
      font-size: 13px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      Key<span>flame</span>
    </div>

    <div class="eyebrow">
      AB Server
    </div>

    <h1>Welcome back.</h1>

    <p class="description">
      Sign in to access your Keyflame account.
    </p>

    <form id="loginForm">

      <div class="field">
        <label for="username">Username</label>

        <input
          id="username"
          type="text"
          placeholder="Enter your username"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit">
        Sign In
      </button>

      <div id="message"></div>

    </form>

    <a class="back" href="index.html">
      ← Back to Keyflame
    </a>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      document.getElementById("message").textContent =
        "Authentication will be connected next.";
    });
  </script>

</body>
</html>
```
