<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyflame — Games</title>
  <link rel="icon" type="image/svg+xml" href="keyflame-logo.svg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #090809;
      color: #fff;
      min-height: 100vh;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .layout {
      min-height: 100vh;
      display: flex;
    }

    /* SIDEBAR */

    .sidebar {
      width: 250px;
      background: #0f0d10;
      border-right: 1px solid #282129;
      padding: 25px 16px;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      margin: 5px 12px 35px;
      letter-spacing: -1px;
    }

    .logo span {
      color: #ff4fa3;
    }

    .nav-title {
      color: #777;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 0 12px 10px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #999;
      padding: 13px 14px;
      border-radius: 12px;
      text-align: left;
      transition: .2s;
    }

    .nav button:hover,
    .nav button.active {
      background: #21151e;
      color: #fff;
    }

    .nav button.active {
      box-shadow: inset 3px 0 #ff4fa3;
    }

    .logout {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 25px;
    }

    .logout button {
      width: 100%;
      padding: 12px;
      border-radius: 11px;
      border: 1px solid #322932;
      background: #151116;
      color: #aaa;
    }

    .logout button:hover {
      color: #fff;
      border-color: #ff4fa3;
    }

    /* MAIN */

    .main {
margin-left: 250px;
      width: calc(100% - 250px);
      padding: 34px;
    
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .topbar h1 {
      font-size: 30px;
      letter-spacing: -1px;
    }

    .topbar p {
      color: #888;
      margin-top: 7px;
    }

    .new-game-btn {
      background: #ff4fa3;
      border: 0;
      color: white;
      padding: 13px 18px;
      border-radius: 12px;
      font-weight: 700;
      transition: .2s;
    }

    .new-game-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    /* GAME GRID */

    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .game-card {
      background: #111012;
      border: 1px solid #282329;
      border-radius: 18px;
      overflow: hidden;
      transition: .2s;
    }

    .game-card:hover {
      transform: translateY(-3px);
      border-color: #ff4fa3;
    }

    .game-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #181318;
      display: block;
    }

    .game-image-placeholder {
      width: 100%;
      height: 180px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 40%, #3b1b32, #181318 55%, #0d0b0e);
      color: #ff5eaa;
      font-size: 42px;
    }

    .game-info {
      padding: 18px;
    }

    .game-title {
      font-size: 18px;
      font-weight: 700;
    }

    .game-description {
      color: #777;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 8px;
      min-height: 40px;
    }

    .game-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      gap: 10px;
    }

    .notes-count {
      color: #777;
      font-size: 12px;
    }

    .open-btn {
      border: 1px solid #45263b;
      background: #21151e;
      color: #ff76b6;
      padding: 9px 13px;
      border-radius: 9px;
    }

    .open-btn:hover {
      background: #2b1825;
    }

    .empty-games {
      border: 1px dashed #302a30;
      border-radius: 18px;
      padding: 60px 20px;
      text-align: center;
      color: #666;
      grid-column: 1 / -1;
    }

    .empty-games strong {
      display: block;
      color: #aaa;
      font-size: 18px;
      margin-bottom: 8px;
    }

    /* MODAL */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .72);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: min(550px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #111012;
      border: 1px solid #382c35;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      gap: 15px;
    }

    .modal-header h2 {
      font-size: 21px;
    }

    .close-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid #302a30;
      background: #181419;
      color: #aaa;
    }

    .close-btn:hover {
      color: #fff;
      border-color: #ff4fa3;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 8px;
    }

    input,
    textarea {
      width: 100%;
      background: #0b0a0c;
      color: #fff;
      border: 1px solid #302a30;
      border-radius: 11px;
      padding: 12px 13px;
      outline: none;
      margin-bottom: 16px;
    }

    input:focus,
    textarea:focus {
      border-color: #ff4fa3;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 10px;
    }

    .image-preview {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #2b252b;
      margin-bottom: 16px;
      display: none;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .secondary-btn,
    .primary-btn {
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 700;
    }

    .secondary-btn {
      background: #171318;
      border: 1px solid #302a30;
      color: #aaa;
    }

    .primary-btn {
      background: #ff4fa3;
      border: 0;
      color: white;
    }

    /* GAME DETAIL */

    .detail {
      width: min(850px, 100%);
    }

    .detail-image {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .detail-placeholder {
      height: 250px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background:
        radial-gradient(circle at center, #3b1b32, #151116 65%);
      color: #ff5eaa;
      font-size: 60px;
      margin-bottom: 20px;
    }

    .detail-title {
      font-size: 29px;
      margin-bottom: 8px;
    }

    .detail-description {
      color: #888;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .detail-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .detail-buttons button {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #332a32;
      background: #171318;
      color: #ddd;
    }

    .detail-buttons button:hover {
      border-color: #ff4fa3;
    }

    .notes-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 10px;
    }

    .notes-heading h3 {
      font-size: 18px;
    }

    .add-note-btn {
      border: 1px solid #45263b;
      background: #21151e;
      color: #ff76b6;
      padding: 9px 12px;
      border-radius: 9px;
    }

    .note {
      background: #0b0a0c;
      border: 1px solid #272329;
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 10px;
    }

    .note-date {
      color: #ff76b6;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .note-text {
      color: #ccc;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .no-notes {
      color: #666;
      font-size: 13px;
      padding: 15px 0;
    }

    /* TOAST */

    .toast {
      position: fixed;
      right: 25px;
      bottom: 25px;
      background: #181318;
      border: 1px solid #4a2a3d;
      padding: 14px 18px;
      border-radius: 12px;
      opacity: 0;
      transform: translateY(15px);
      pointer-events: none;
      transition: .25s;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* RESPONSIVE */

    @media (max-width: 850px) {
      .sidebar {
        width: 200px;
      }

      .main {
        margin-left: 200px;
        width: calc(100% - 200px);
      }

      .games-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 700px) {
      .layout {
        display: block;
      }

      .sidebar {
        position: static;
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid #282129;
      }

      .logout {
        position: static;
        margin-top: 20px;
      }

      .main {
        margin-left: 0;
        width: 100%;
        padding: 20px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .games-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->

  <aside class="sidebar">

      <a href="index.html" class="brand">
        <div class="brand-mark">K</div>
        <div class="brand-name">Keyflame</div>
      </a>

      <div class="nav-title">Menu</div>

      <nav class="nav">

        <a href="dashboard.html" class="nav-link" onclick=">
          <span class="nav-icon">⌂</span>
          <span>Dashboard</span>
        </a>

        <a href="games.html" class="nav-link active" onclick=">
          <span class="nav-icon">▣</span>
          <span>Games</span>
        </a>

        <a href="bucks.html" class="nav-link" onclick=">
          <span class="nav-icon">¥</span>
          <span>AB Bucks</span>
        </a>

        <a href="history.html" class="nav-link" onclick=">
          <span class="nav-icon">↺</span>
          <span>History</span>
        </a>

        <a href="analytics.html" class="nav-link" onclick=">
          <span class="nav-icon">⌁</span>
          <span>Analytics</span>
        </a>

        <a href="profile.html" class="nav-link" onclick=">
          <span class="nav-icon">◉</span>
          <span>Profile</span>
        </a>

        <a href="settings.html" class="nav-link" onclick=">
          <span class="nav-icon">⚙</span>
          <span>Settings</span>
        </a>

      </nav>

      <div class="sidebar-bottom">

        <a href="profile.html" class="profile-mini" id="sidebarProfile">
          <div class="avatar" id="sidebarAvatar">K</div>
          <div class="profile-mini-text">
            <div class="profile-mini-name" id="sidebarName">Kian</div>
            <div class="profile-mini-user" id="sidebarUsername">kian6203</div>
          </div>
        </a>

        <a href="#" class="nav-link logout" id="logoutBtn" onclick="event.preventDefault(); if(typeof logout === 'function'){ logout(); } else { sessionStorage.removeItem('keyflame_user'); window.location.href='login.html'; }">
          <span class="nav-icon">↪</span>
          <span>Logout</span>
        </a>

      </div>

    </aside>


  <!-- MAIN -->

  <main class="main">

    <div class="topbar">

      <div>
        <h1>Games</h1>
        <p>Your real-life games and memories.</p>
      </div>

      <button
        class="new-game-btn"
        onclick="openNewGame()"
      >
        + New Game
      </button>

    </div>


    <div
      class="games-grid"
      id="gamesGrid"
    ></div>

  </main>

</div>


<!-- NEW GAME MODAL -->

<div
  class="modal-overlay"
  id="newGameModal"
>

  <div class="modal">

    <div class="modal-header">

      <h2>Create a New Game</h2>

      <button
        class="close-btn"
        onclick="closeModal('newGameModal')"
      >
        ×
      </button>

    </div>


    <label for="gameTitle">
      Game Name
    </label>

    <input
      id="gameTitle"
      type="text"
      placeholder="Example: Rip-Off Minecraft"
    >


    <label for="gameDescription">
      Description
    </label>

    <textarea
      id="gameDescription"
      placeholder="What is this game?"
    ></textarea>


    <label for="gameImage">
      Picture
    </label>

    <input
      id="gameImage"
      type="file"
      accept="image/*"
      onchange="previewImage()"
    >

    <img
      id="imagePreview"
      class="image-preview"
      alt="Game preview"
    >


    <div class="modal-actions">

      <button
        class="secondary-btn"
        onclick="closeModal('newGameModal')"
      >
        Cancel
      </button>

      <button
        class="primary-btn"
        onclick="createGame()"
      >
        Create Game
      </button>

    </div>

  </div>

</div>


<!-- GAME DETAIL MODAL -->

<div
  class="modal-overlay"
  id="gameDetailModal"
>

  <div class="modal detail">

    <div class="modal-header">

      <h2>Game</h2>

      <button
        class="close-btn"
        onclick="closeModal('gameDetailModal')"
      >
        ×
      </button>

    </div>


    <img
      id="detailImage"
      class="detail-image"
      alt="Game picture"
    >

    <div
      id="detailPlaceholder"
      class="detail-placeholder"
    >
      🎮
    </div>


    <h1
      id="detailTitle"
      class="detail-title"
    ></h1>


    <p
      id="detailDescription"
      class="detail-description"
    ></p>


    <div class="detail-buttons">

      <button onclick="openSettings()">
        ⚙ Settings
      </button>

      <button onclick="openNoteModal()">
        + Add Note
      </button>

    </div>


    <div class="notes-heading">

      <h3>Notes</h3>

      <button
        class="add-note-btn"
        onclick="openNoteModal()"
      >
        + Note
      </button>

    </div>


    <div id="notesList"></div>

  </div>

</div>


<!-- SETTINGS MODAL -->

<div
  class="modal-overlay"
  id="settingsModal"
>

  <div class="modal">

    <div class="modal-header">

      <h2>Game Settings</h2>

      <button
        class="close-btn"
        onclick="closeModal('settingsModal')"
      >
        ×
      </button>

    </div>


    <label for="editTitle">
      Game Name
    </label>

    <input
      id="editTitle"
      type="text"
    >


    <label for="editDescription">
      Description
    </label>

    <textarea
      id="editDescription"
    ></textarea>


    <label for="editImage">
      Change Picture
    </label>

    <input
      id="editImage"
      type="file"
      accept="image/*"
      onchange="previewEditImage()"
    >

    <img
      id="editImagePreview"
      class="image-preview"
      alt="New game picture preview"
    >


    <div class="modal-actions">

      <button
        class="secondary-btn"
        onclick="closeModal('settingsModal')"
      >
        Cancel
      </button>

      <button
        class="primary-btn"
        onclick="saveGameSettings()"
      >
        Save Changes
      </button>

    </div>

  </div>

</div>


<!-- NOTE MODAL -->

<div
  class="modal-overlay"
  id="noteModal"
>

  <div class="modal">

    <div class="modal-header">

      <h2>Add Note</h2>

      <button
        class="close-btn"
        onclick="closeModal('noteModal')"
      >
        ×
      </button>

    </div>


    <label for="noteText">
      What happened?
    </label>

    <textarea
      id="noteText"
      placeholder="Write down what happened, scores, rules, memories, etc."
    ></textarea>


    <div class="modal-actions">

      <button
        class="secondary-btn"
        onclick="closeModal('noteModal')"
      >
        Cancel
      </button>

      <button
        class="primary-btn"
        onclick="saveNote()"
      >
        Save Note
      </button>

    </div>

  </div>

</div>


<div
  class="toast"
  id="toast"
></div>


<script>

  const CURRENT_USERNAME = (sessionStorage.getItem("keyflame_user") || "").trim();

  if (!CURRENT_USERNAME) {
    window.location.href = "login.html";
  }

  const STORAGE_KEY = "keyflame_games_" + CURRENT_USERNAME;

  let games = [];
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    games = Array.isArray(saved) ? saved : [];
    games.forEach(game => {
      if (!Array.isArray(game.notes)) game.notes = [];
    });
  } catch {
    games = [];
  }

  let selectedGameId = null;


  /* SAVE */

  function saveGames() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(games)
    );

  }


  /* RENDER GAME LIST */

  function renderGames() {

    const grid =
      document.getElementById("gamesGrid");


    if (games.length === 0) {

      grid.innerHTML = `

        <div class="empty-games">

          <strong>No games yet</strong>

          Create your first game with
          the "+ New Game" button.

        </div>

      `;

      return;

    }


    grid.innerHTML =
      games.map(game => {

        const image = game.image
          ? `
            <img
              class="game-image"
              src="${game.image}"
              alt="${escapeHTML(game.title)}"
            >
          `
          : `
            <div class="game-image-placeholder">
              🎮
            </div>
          `;


        return `

          <div class="game-card">

            ${image}

            <div class="game-info">

              <div class="game-title">
                ${escapeHTML(game.title)}
              </div>

              <div class="game-description">
                ${escapeHTML(
                  game.description ||
                  "No description yet."
                )}
              </div>

              <div class="game-footer">

                <span class="notes-count">
                  ${game.notes.length}
                  ${game.notes.length === 1 ? "note" : "notes"}
                </span>

                <button
                  class="open-btn"
                  onclick="openGame('${game.id}')"
                >
                  Open
                </button>

              </div>

            </div>

          </div>

        `;

      }).join("");

  }


  /* NEW GAME */

  function openNewGame() {

    document.getElementById("gameTitle").value = "";
    document.getElementById("gameDescription").value = "";
    document.getElementById("gameImage").value = "";

    const preview =
      document.getElementById("imagePreview");

    preview.src = "";
    preview.style.display = "none";

    document
      .getElementById("newGameModal")
      .classList.add("show");

  }


  function createGame() {

    const title =
      document.getElementById("gameTitle")
        .value.trim();

    const description =
      document.getElementById("gameDescription")
        .value.trim();

    const image =
      document.getElementById("imagePreview")
        .src;


    if (!title) {

      showToast("Give the game a name first.");

      return;

    }


    const game = {

      id:
        Date.now().toString(),

      title,

      description,

      image:
        image &&
        image !== window.location.href
          ? image
          : "",

      notes: [],

      createdAt:
        new Date().toISOString()

    };


    games.push(game);

    saveGames();

    renderGames();

    closeModal("newGameModal");

    showToast("Game created.");

  }


  /* OPEN GAME */

  function openGame(id) {

    const game =
      games.find(g => g.id === id);


    if (!game) return;


    selectedGameId = id;


    document.getElementById("detailTitle")
      .textContent = game.title;


    document.getElementById("detailDescription")
      .textContent =
      game.description ||
      "No description yet.";


    const image =
      document.getElementById("detailImage");

    const placeholder =
      document.getElementById("detailPlaceholder");


    if (game.image) {

      image.src = game.image;
      image.style.display = "block";
      placeholder.style.display = "none";

    } else {

      image.style.display = "none";
      placeholder.style.display = "grid";

    }


    renderNotes();


    document
      .getElementById("gameDetailModal")
      .classList.add("show");

  }


  /* GAME SETTINGS */

  function openSettings() {

    const game =
      games.find(g => g.id === selectedGameId);


    if (!game) return;


    document.getElementById("editTitle")
      .value = game.title;


    document.getElementById("editDescription")
      .value = game.description || "";


    document.getElementById("editImage")
      .value = "";


    const preview =
      document.getElementById("editImagePreview");


    if (game.image) {

      preview.src = game.image;
      preview.style.display = "block";

    } else {

      preview.src = "";
      preview.style.display = "none";

    }


    document
      .getElementById("settingsModal")
      .classList.add("show");

  }


  function saveGameSettings() {

    const game =
      games.find(g => g.id === selectedGameId);


    if (!game) return;


    const title =
      document.getElementById("editTitle")
        .value.trim();


    if (!title) {

      showToast("Game name cannot be empty.");

      return;

    }


    game.title = title;

    game.description =
      document.getElementById("editDescription")
        .value.trim();


    const preview =
      document.getElementById("editImagePreview");


    if (
      preview.style.display !== "none" &&
      preview.src
    ) {

      game.image = preview.src;

    }


    saveGames();

    renderGames();

    closeModal("settingsModal");

    openGame(selectedGameId);

    showToast("Game updated.");

  }


  /* NOTES */

  function openNoteModal() {

    document.getElementById("noteText")
      .value = "";


    document
      .getElementById("noteModal")
      .classList.add("show");

  }


  function saveNote() {

    const game =
      games.find(g => g.id === selectedGameId);


    if (!game) return;


    const text =
      document.getElementById("noteText")
        .value.trim();


    if (!text) {

      showToast("Write something in the note first.");

      return;

    }


    game.notes.push({

      text,

      date:
        new Date().toLocaleString()

    });


    saveGames();

    renderGames();

    renderNotes();

    closeModal("noteModal");

    showToast("Note saved.");

  }


  function renderNotes() {

    const game =
      games.find(g => g.id === selectedGameId);


    const list =
      document.getElementById("notesList");


    if (!game || game.notes.length === 0) {

      list.innerHTML =
        `<div class="no-notes">
          No notes yet. Add one to remember what happened.
        </div>`;

      return;

    }


    list.innerHTML =
      game.notes
        .slice()
        .reverse()
        .map(note => `

          <div class="note">

            <div class="note-date">
              ${escapeHTML(note.date)}
            </div>

            <div class="note-text">
              ${escapeHTML(note.text)}
            </div>

          </div>

        `)
        .join("");

  }


  /* IMAGE PREVIEWS */

  function previewImage() {

    const file =
      document.getElementById("gameImage")
        .files[0];


    const preview =
      document.getElementById("imagePreview");


    if (!file) {

      preview.style.display = "none";

      return;

    }


    const reader =
      new FileReader();


    reader.onload = function(event) {

      preview.src =
        event.target.result;

      preview.style.display =
        "block";

    };


    reader.readAsDataURL(file);

  }


  function previewEditImage() {

    const file =
      document.getElementById("editImage")
        .files[0];


    if (!file) return;


    const reader =
      new FileReader();


    reader.onload = function(event) {

      const preview =
        document.getElementById("editImagePreview");

      preview.src =
        event.target.result;

      preview.style.display =
        "block";

    };


    reader.readAsDataURL(file);

  }


  /* MODALS */

  function closeModal(id) {

    document
      .getElementById(id)
      .classList.remove("show");

  }


  /* NAVIGATION */

  function goDashboard() {
    window.location.href = "dashboard.html";
  }

  function goGames() {
    window.location.href = "games.html";
  }

  function goBucks() {
    window.location.href = "bucks.html";
  }

  function goHistory() {
    window.location.href = "history.html";
  }

  function goAnalytics() {
    window.location.href = "analytics.html";
  }

  function goProfile() {
    window.location.href = "profile.html";
  }

  function goSettings() {
    window.location.href = "settings.html";
  }


  function logout() {

    sessionStorage.removeItem(
      "keyflame_user"
    );

    window.location.href =
      "login.html";

  }


  /* TOAST */

  function showToast(message) {

    const toast =
      document.getElementById("toast");


    toast.textContent = message;

    toast.classList.add("show");


    setTimeout(() => {

      toast.classList.remove("show");

    }, 2500);

  }


  /* SECURITY */

  function escapeHTML(value) {

    return String(value)

      .replaceAll("&", "&amp;")

      .replaceAll("<", "&lt;")

      .replaceAll(">", "&gt;")

      .replaceAll('"', "&quot;")

      .replaceAll("'", "&#039;");

  }


  /* CLOSE MODAL WHEN CLICKING OUTSIDE */

  document
    .querySelectorAll(".modal-overlay")
    .forEach(modal => {

      modal.addEventListener(
        "click",
        event => {

          if (event.target === modal) {

            modal.classList.remove("show");

          }

        }
      );

    });


  /* START */

  renderGames();

</script>

</body>
</html>
