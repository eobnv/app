<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History — Keyflame</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at 80% 10%, rgba(255, 75, 160, 0.12), transparent 30%),
    #090809;
  color: white;
  min-height: 100vh;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  display: flex;
  min-height: 100vh;
}

/* SIDEBAR */

.sidebar {
  width: 250px;
  min-height: 100vh;
  background: rgba(18, 15, 18, 0.96);
  border-right: 1px solid rgba(255,255,255,0.08);
  padding: 25px 16px;
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
}

.logo {
  font-size: 25px;
  font-weight: 800;
  margin-bottom: 35px;
  padding-left: 10px;
}

.logo span {
  color: #ff5ca8;
}

.nav {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.nav button {
  border: none;
  background: transparent;
  color: #aaa;
  padding: 13px 14px;
  border-radius: 12px;
  text-align: left;
  transition: 0.2s;
}

.nav button:hover {
  background: rgba(255,92,168,0.1);
  color: white;
}

.nav button.active {
  background: rgba(255,92,168,0.15);
  color: #ff76b7;
  border: 1px solid rgba(255,92,168,0.18);
}

.logout {
  position: absolute;
  bottom: 25px;
  left: 16px;
  right: 16px;
}

.logout button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);
  color: #aaa;
}

.logout button:hover {
  color: white;
  background: rgba(255,255,255,0.07);
}

/* MAIN */

.main {
margin-left: 250px;
  width: calc(100% - 250px);
  padding: 34px;

    }

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 30px;
}

.title h1 {
  font-size: 34px;
  margin-bottom: 7px;
}

.title p {
  color: #999;
}

.balance {
  background: linear-gradient(
    135deg,
    rgba(255,92,168,0.18),
    rgba(255,255,255,0.04)
  );
  border: 1px solid rgba(255,92,168,0.2);
  padding: 18px 22px;
  border-radius: 16px;
  min-width: 170px;
}

.balance small {
  color: #999;
  display: block;
  margin-bottom: 5px;
}

.balance strong {
  font-size: 25px;
  color: #ff75b6;
}

/* CONTROLS */

.controls {
  display: grid;
  grid-template-columns: 1fr 180px 180px;
  gap: 12px;
  margin-bottom: 22px;
}

.control {
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 13px;
  color: white;
  padding: 13px 15px;
  outline: none;
}

.control::placeholder {
  color: #777;
}

.control:focus {
  border-color: rgba(255,92,168,0.5);
}

/* CARD */

.card {
  background: rgba(18,15,18,0.78);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 18px;
  overflow: hidden;
}

.card-header {
  padding: 22px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-header h2 {
  font-size: 19px;
}

.count {
  color: #888;
  font-size: 13px;
}

/* TABLE */

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 720px;
}

th {
  text-align: left;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #777;
  padding: 15px 22px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

td {
  padding: 17px 22px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  color: #ddd;
  font-size: 14px;
}

tr:hover td {
  background: rgba(255,255,255,0.025);
}

.amount {
  font-weight: 700;
}

.amount.add {
  color: #61e6a5;
}

.amount.remove {
  color: #ff6f8f;
}

.reason {
  color: #aaa;
}

.game {
  color: #ff75b6;
}

.date {
  color: #999;
  white-space: nowrap;
}

.empty {
  padding: 55px 20px;
  text-align: center;
  color: #777;
}

.empty strong {
  display: block;
  color: #bbb;
  margin-bottom: 7px;
  font-size: 16px;
}

/* MOBILE */

@media (max-width: 850px) {
      .sidebar {
        width: 200px;

  .main {
    margin-left: 200px;
    width: calc(100% - 200px);
    padding: 25px;
  }

  .controls {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 650px) {
  .sidebar {
    position: static;
    width: 100%;
    min-height: auto;
    border-right: none;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .app {
    display: block;
  }

  .main {
    margin-left: 0;
    width: 100%;
    padding: 22px;
  }

  .logout {
    position: static;
    margin-top: 20px;
  }

  .top {
    flex-direction: column;
    align-items: flex-start;
  }

  .balance {
    width: 100%;
  }
}
</style>
  <link rel="stylesheet" href="theme.css">
</head>

<body>

<div class="app">

  <aside class="sidebar">

      <a href="index.html" class="brand">
        <div class="brand-mark">K</div>
        <div class="brand-name">Keyflame</div>
      </a>

      <div class="nav-title">Menu</div>

      <nav class="nav">

        <a href="dashboard.html" class="nav-link" onclick=">
          <span class="nav-icon">⌂</span>
          <span>Dashboard</span>
        </a>

        <a href="games.html" class="nav-link" onclick=">
          <span class="nav-icon">▣</span>
          <span>Games</span>
        </a>

        <a href="bucks.html" class="nav-link" onclick=">
          <span class="nav-icon">¥</span>
          <span>AB Bucks</span>
        </a>

        <a href="history.html" class="nav-link active" onclick=">
          <span class="nav-icon">↺</span>
          <span>History</span>
        </a>

        <a href="analytics.html" class="nav-link" onclick=">
          <span class="nav-icon">⌁</span>
          <span>Analytics</span>
        </a>

        <a href="profile.html" class="nav-link" onclick=">
          <span class="nav-icon">◉</span>
          <span>Profile</span>
        </a>

        <a href="settings.html" class="nav-link" onclick=">
          <span class="nav-icon">⚙</span>
          <span>Settings</span>
        </a>

      </nav>

      <div class="sidebar-bottom">

        <a href="profile.html" class="profile-mini" id="sidebarProfile">
          <div class="avatar" id="sidebarAvatar">K</div>
          <div class="profile-mini-text">
            <div class="profile-mini-name" id="sidebarName">Kian</div>
            <div class="profile-mini-user" id="sidebarUsername">kian6203</div>
          </div>
        </a>

        <a href="#" class="nav-link logout" id="logoutBtn">
          <span class="nav-icon">↪</span>
          <span>Logout</span>
        </a>

      </div>

    </aside>

  <main class="main">

    <div class="top">

      <div class="title">
        <h1>Transaction History</h1>
        <p>See everything that has happened with your AB Bucks.</p>
      </div>

      <div class="balance">
        <small>Current Balance</small>
        <strong id="balance">¥0</strong>
      </div>

    </div>

    <div class="controls">

      <input
        id="search"
        class="control"
        type="text"
        placeholder="Search reason or game..."
        oninput="render()"
      >

      <select id="typeFilter" class="control" onchange="render()">
        <option value="all">All Transactions</option>
        <option value="add">Added</option>
        <option value="remove">Removed</option>
      </select>

      <select id="gameFilter" class="control" onchange="render()">
        <option value="all">All Games</option>
      </select>

    </div>

    <section class="card">

      <div class="card-header">
        <h2>All Transactions</h2>
        <span class="count" id="count">0 transactions</span>
      </div>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Amount</th>
              <th>Balance After</th>
              <th>Reason</th>
              <th>Game</th>
              <th>Date</th>
            </tr>
          </thead>

          <tbody id="history"></tbody>

        </table>

      </div>

    </section>

  </main>

</div>

<script>

const CURRENT_USERNAME = (sessionStorage.getItem("keyflame_user") || "").trim();

if (!CURRENT_USERNAME) {
  window.location.href = "login.html";
}

const STORAGE_KEY = "keyflame_account_" + CURRENT_USERNAME;

if (CURRENT_USERNAME === "kian6203" && !localStorage.getItem(STORAGE_KEY)) {
  const legacy = localStorage.getItem("keyflame_admin_data");
  if (legacy) localStorage.setItem(STORAGE_KEY, legacy);
}

function getData() {

  try {

    const saved = localStorage.getItem(STORAGE_KEY);

    if (!saved) {
      return {
        balance: 0,
        transactions: []
      };
    }

    const data = JSON.parse(saved);

    if (!data || typeof data !== "object") {
      return {
        balance: 0,
        transactions: []
      };
    }

    if (!Array.isArray(data.transactions)) {
      data.transactions = [];
    }

    if (typeof data.balance !== "number") {
      data.balance = 0;
    }

    return data;

  } catch (error) {

    return {
      balance: 0,
      transactions: []
    };

  }

}

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

function formatDate(transaction) {

  const value =
    transaction.timestamp ||
    transaction.time ||
    transaction.date;

  if (!value) {
    return "Unknown";
  }

  const date = new Date(value);

  if (isNaN(date.getTime())) {
    return escapeHTML(value);
  }

  return date.toLocaleString([], {
    dateStyle: "medium",
    timeStyle: "short"
  });

}

function buildGameFilter(transactions) {

  const select = document.getElementById("gameFilter");

  const current = select.value;

  const games = [...new Set(
    transactions
      .map(t => t.game)
      .filter(Boolean)
  )].sort();

  select.innerHTML = `
    <option value="all">All Games</option>
    ${games.map(game => `
      <option value="${escapeHTML(game)}">${escapeHTML(game)}</option>
    `).join("")}
  `;

  if (games.includes(current)) {
    select.value = current;
  }

}

function render() {

  const data = getData();
  const transactions = [...data.transactions].reverse();

  document.getElementById("balance").textContent =
    `¥${data.balance}`;

  buildGameFilter(data.transactions);

  const search =
    document.getElementById("search").value
      .trim()
      .toLowerCase();

  const type =
    document.getElementById("typeFilter").value;

  const game =
    document.getElementById("gameFilter").value;

  const filtered = transactions.filter(transaction => {

    const amount = Number(transaction.amount || 0);

    const transactionType =
      amount >= 0 ? "add" : "remove";

    const reason =
      String(transaction.reason || "").toLowerCase();

    const transactionGame =
      String(transaction.game || "").toLowerCase();

    const matchesSearch =
      !search ||
      reason.includes(search) ||
      transactionGame.includes(search);

    const matchesType =
      type === "all" ||
      transactionType === type;

    const matchesGame =
      game === "all" ||
      String(transaction.game || "") === game;

    return matchesSearch && matchesType && matchesGame;

  });

  document.getElementById("count").textContent =
    `${filtered.length} transaction${filtered.length === 1 ? "" : "s"}`;

  const history = document.getElementById("history");

  if (!filtered.length) {

    history.innerHTML = `
      <tr>
        <td colspan="5">
          <div class="empty">
            <strong>No transactions found</strong>
            Try changing your search or filters.
          </div>
        </td>
      </tr>
    `;

    return;
  }

  history.innerHTML = filtered.map(transaction => {

    const amount = Number(transaction.amount || 0);

    const isAdd = amount >= 0;

    const amountText =
      `${isAdd ? "+" : ""}¥${amount}`;

    const balanceAfter =
      transaction.balanceAfter ??
      transaction.newBalance ??
      "";

    return `
      <tr>

        <td>
          <span class="amount ${isAdd ? "add" : "remove"}">
            ${escapeHTML(amountText)}
          </span>
        </td>

        <td>
          ¥${escapeHTML(balanceAfter)}
        </td>

        <td>
          <span class="reason">
            ${escapeHTML(transaction.reason || "No reason given")}
          </span>
        </td>

        <td>
          <span class="game">
            ${escapeHTML(transaction.game || "—")}
          </span>
        </td>

        <td>
          <span class="date">
            ${formatDate(transaction)}
          </span>
        </td>

      </tr>
    `;

  }).join("");

}

function go(page) {
  window.location.href = page;
}

function comingSoon(name) {
  alert(name + " is coming next!");
}

function logout() {

  sessionStorage.removeItem("keyflame_user");

  window.location.href = "login.html";

}

render();

window.addEventListener("storage", render);

</script>

</body>
</html>
